name: Benchmark

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          repository: ${{ github.repository }}

      - name: Checkout Minify++
        uses: actions/checkout@v7
        with:
          repository: minify-cx/minify
          ref: main
          path: .benchmark-dependencies/minifypp
          persist-credentials: false

      - name: Identify Minify++ revision
        id: minifypp-revision
        run: |
          revision="$(git -C .benchmark-dependencies/minifypp rev-parse HEAD)"
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "MINIFYPP_VERSION=main.${revision:0:7}" >> "$GITHUB_ENV"

      - name: Build Minify++ benchmark adapter
        run: packages/minifiers/native/build-minifypp.sh

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      # For jshrink
      - name: Setup Composer
        uses: php-actions/composer@v6
        with:
          working_dir: packages/minifiers

      # For Google Closure Compiler
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Git
        run: |
          git config user.name "minification-benchmarks automation"
          # Keep in sync with "gitIgnoredAuthors" in renovate.json: Renovate matches
          # commits by author email and force-pushes away any it doesn't recognize
          # as automation
          git config user.email github-actions@github.com

      # Renovate recreates its branches from the base branch, discarding the
      # generated results commit. Cache data.json so the benchmark only re-runs
      # measurements whose inputs changed.
      - name: Restore benchmark results
        id: benchmark-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/data/data/data.json
          key: benchmark-${{ steps.minifypp-revision.outputs.sha }}-${{ hashFiles('pnpm-lock.yaml', 'packages/minifiers/composer.lock', 'packages/data/data/data.json', 'packages/minifiers/minifiers/minifypp.ts', 'packages/minifiers/native/minifypp-driver.cpp', 'packages/minifiers/native/build-minifypp.sh') }}

      - name: Refresh Minify++ results
        run: node packages/data/refresh-minifypp-results.mjs

      - name: Benchmark
        run: pnpm bench-all

      # Save before committing so the results survive failures in the
      # commit or report steps
      - name: Save benchmark results
        if: steps.benchmark-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/data/data/data.json
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}

      - name: Update README
        run: pnpm update-readme
        env:
          PRESERVE_AI_ANALYSIS: "1"

      - name: Commit benchmark results and report
        run: |
          # Ignored by Renovate
          git add packages/data/data/data.json README.md
          if ! git diff --cached --quiet; then
            # [skip ci] prevents the generated commit from benchmarking itself.
            git commit -nm "chore: update benchmark results and report [skip ci]"
            git push
          fi
